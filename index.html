<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weight Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #F4F1EA;        /* สีผ้าลินิน / กระดาษถนอมสายตา */
      --card-bg: #FAF8F4;         /* สีครีมนมละมุน ไม่ขาวจ้า */
      --surface-soft: #EDE8DF;    /* สีพื้นผิวรอง โทนทรายอ่อน */
      --text-main: #3D3935;       /* สีน้ำตาลถ่านนุ่มๆ อ่านสบายตา */
      --text-muted: #8A8279;      /* สีเทาอุ่น */
      --accent-sage: #7A8F80;     /* สีเขียวมะกอกตุ่น */
      --accent-clay: #C68B72;     /* สีดินเผาอ่อน */
      --border-color: #E4DFD5;    /* เส้นขอบบางๆ กลมกลืน */
      --shadow-soft: 0 8px 24px rgba(61, 57, 53, 0.04);
      --radius: 22px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 18px;
      -webkit-font-smoothing: antialiased;
    }

    .app-container { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 22px; }
    
    header {
      background: var(--card-bg);
      padding: 20px 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border-color);
    }
    .header-title h1 { font-size: 1.15rem; font-weight: 500; letter-spacing: -0.01em; color: var(--text-main); }
    .header-title p { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; font-weight: 300; }
    
    .sync-badge {
      display: flex; align-items: center; gap: 6px; font-size: 0.72rem;
      background: var(--surface-soft); padding: 6px 12px; border-radius: 50px;
      color: var(--accent-sage); font-weight: 500;
    }
    .dot { width: 7px; height: 7px; background-color: var(--accent-sage); border-radius: 50%; animation: pulse 2.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.35; } 100% { opacity: 1; } }

    .section-title { font-size: 0.85rem; font-weight: 400; color: var(--text-muted); margin-bottom: 12px; padding-left: 4px; }
    .profiles-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    
    .profile-card {
      background: var(--card-bg);
      padding: 18px 16px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
      position: relative;
    }
    .profile-card:hover { background-color: #FDFCFA; }
    .profile-card:active { transform: scale(0.97); }
    
    .profile-name { font-size: 1rem; font-weight: 500; margin-bottom: 6px; padding-right: 38px; color: var(--text-main); }
    .profile-latest { font-size: 0.9rem; font-weight: 500; color: var(--accent-clay); margin-bottom: 3px; }
    .profile-target { font-size: 0.74rem; color: var(--text-muted); font-weight: 300; }
    
    .card-actions {
      position: absolute; top: 14px; right: 14px; display: flex; align-items: center; gap: 6px;
    }
    .color-tag { width: 10px; height: 10px; border-radius: 50%; opacity: 0.9; }
    .edit-btn {
      background: var(--surface-soft); border: none; width: 22px; height: 22px; border-radius: 50%;
      font-size: 0.68rem; color: var(--text-muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: color 0.2s;
    }
    .edit-btn:hover { color: var(--text-main); }

    /* Bottom Sheet Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(61, 57, 53, 0.28); backdrop-filter: blur(4px);
      display: flex; justify-content: center; align-items: flex-end;
      opacity: 0; pointer-events: none; transition: opacity 0.25s ease; z-index: 1000;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content {
      background: var(--card-bg); width: 100%; max-width: 460px; padding: 26px 22px 34px 22px;
      border-radius: 26px 26px 0 0; box-shadow: 0 -8px 30px rgba(61, 57, 53, 0.08);
      border-top: 1px solid var(--border-color);
      transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-overlay.active .modal-content { transform: translateY(0); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .modal-header h3 { font-size: 1.05rem; font-weight: 500; color: var(--text-main); }
    .close-btn {
      background: var(--surface-soft); border: none; width: 30px; height: 30px; border-radius: 50%;
      font-size: 0.85rem; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center;
    }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 400; }
    .form-input {
      width: 100%; padding: 12px 15px; background: var(--bg-color); border: 1px solid var(--border-color);
      border-radius: 14px; font-size: 0.95rem; color: var(--text-main); outline: none; transition: all 0.2s;
    }
    .form-input:focus { border-color: var(--accent-sage); background: var(--card-bg); }
    
    .color-picker-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .color-option {
      width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent;
      transition: transform 0.15s ease;
    }
    .color-option.selected { border-color: var(--text-main); transform: scale(1.12); }

    .submit-btn {
      width: 100%; padding: 14px; background: var(--text-main); color: var(--card-bg);
      border: none; border-radius: 14px; font-size: 0.95rem; font-weight: 500; cursor: pointer; margin-top: 6px;
      transition: opacity 0.2s;
    }
    .submit-btn:hover { opacity: 0.92; }

    /* History Card */
    .history-card {
      background: var(--card-bg); padding: 20px; border-radius: var(--radius);
      box-shadow: var(--shadow-soft); border: 1px solid var(--border-color);
    }
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .history-list { display: flex; flex-direction: column; max-height: 270px; overflow-y: auto; }
    .history-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 11px 0; border-bottom: 1px solid var(--surface-soft); font-size: 0.85rem;
    }
    .history-item:last-child { border-bottom: none; }
    .history-info .name { font-weight: 500; display: flex; align-items: center; gap: 7px; color: var(--text-main); }
    .history-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .history-info .time { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; font-weight: 300; }
    .history-right { display: flex; align-items: center; gap: 10px; }
    .history-weight { font-weight: 500; color: var(--accent-clay); }
    .delete-log-btn {
      background: none; border: none; color: #C5BEB5; font-size: 0.78rem; cursor: pointer; padding: 4px; transition: color 0.2s;
    }
    .delete-log-btn:hover { color: #C87A7A; }
    .empty-box { text-align: center; color: var(--text-muted); padding: 18px; font-size: 0.82rem; font-weight: 300; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="header-title">
        <h1>Weight Tracker</h1>
        <p>บันทึกน้ำหนักประจำวัน</p>
      </div>
      <div class="sync-badge">
        <div class="dot"></div>
        <span id="syncStatus">Ready</span>
      </div>
    </header>

    <div>
      <div class="section-title">เลือกสมาชิกเพื่อบันทึก</div>
      <div id="profilesGrid" class="profiles-grid"></div>
    </div>

    <div class="history-card">
      <div class="history-header">
        <div class="section-title" style="margin-bottom: 0;">ประวัติการชั่งล่าสุด</div>
      </div>
      <div id="historyList" class="history-list"></div>
    </div>
  </div>

  <!-- Modal บันทึกน้ำหนัก -->
  <div id="weightModal" class="modal-overlay" onclick="closeModal(event, 'weightModal')">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modalMemberName">บันทึกน้ำหนัก</h3>
        <button class="close-btn" onclick="toggleModal('weightModal', false)">✕</button>
      </div>
      <form id="weightForm" onsubmit="handleWeightSubmit(event)">
        <input type="hidden" id="selectedId">
        <div class="form-group">
          <label>น้ำหนักปัจจุบัน (กก.)</label>
          <input type="number" step="0.1" id="weightInput" class="form-input" placeholder="เช่น 55.5" required>
        </div>
        <div class="form-group">
          <label>โน้ตเพิ่มเติม (ถ้ามี)</label>
          <input type="text" id="noteInput" class="form-input" placeholder="เช่น เช้านี้, หลังออกกำลังกาย">
        </div>
        <button type="submit" class="submit-btn">บันทึกข้อมูล</button>
      </form>
    </div>
  </div>

  <!-- Modal แก้ไขโปรไฟล์ -->
  <div id="editModal" class="modal-overlay" onclick="closeModal(event, 'editModal')">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="editModalTitle">ตั้งค่าโปรไฟล์</h3>
        <button class="close-btn" onclick="toggleModal('editModal', false)">✕</button>
      </div>
      <form id="editForm" onsubmit="handleEditSubmit(event)">
        <input type="hidden" id="editMemberId">
        <div class="form-group">
          <label>ชื่อสมาชิก</label>
          <input type="text" id="editNameInput" class="form-input" required>
        </div>
        <div class="form-group">
          <label>น้ำหนักเป้าหมาย (กก.) — ใส่ - หากไม่ระบุ</label>
          <input type="text" id="editTargetInput" class="form-input" placeholder="เช่น 60 หรือ -">
        </div>
        <div class="form-group">
          <label>สีประจำตัว</label>
          <div class="color-picker-grid" id="colorPickerGrid"></div>
          <input type="hidden" id="editColorInput">
        </div>
        <button type="submit" class="submit-btn">บันทึกการตั้งค่า</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, addDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "",
      authDomain: "",
      projectId: "",
      storageBucket: "",
      messagingSenderId: "",
      appId: ""
    };

    const defaultProfiles = [
      { id: "1", name: "Hamdee", targetWeight: "70", color: "Gray" },
      { id: "2", name: "Fatimah", targetWeight: "60", color: "Purple" },
      { id: "3", name: "Hanan", targetWeight: "80", color: "Yellow" },
      { id: "4", name: "Haneen", targetWeight: "50", color: "Green" },
      { id: "5", name: "Husna", targetWeight: "45", color: "Orange" },
      { id: "6", name: "Husnee", targetWeight: "40", color: "Pink" },
      { id: "7", name: "A'fattah", targetWeight: "-", color: "Blue" }
    ];

    /* พาเลตสีตุ่นละมุนตา (Muted Earth & Pastel Tones) */
    const colorMap = {
      'Gray': '#A39E96',    /* Warm Stone */
      'Purple': '#AEA2B8',  /* Dusty Lavender */
      'Yellow': '#D8B884',  /* Soft Oat / Honey */
      'Green': '#8AA392',   /* Muted Sage */
      'Orange': '#D49B7E',  /* Warm Terracotta */
      'Pink': '#CFA3A1',    /* Dusty Rose */
      'Blue': '#8EAAB8'     /* Muted Slate Blue */
    };

    let profiles = [];
    let logs = [];
    let db = null;
    const useFirebase = Boolean(firebaseConfig.apiKey && firebaseConfig.projectId);

    async function initApp() {
      if (useFirebase) {
        try {
          const app = initializeApp(firebaseConfig);
          db = getFirestore(app);
          document.getElementById('syncStatus').innerText = 'Live Sync';

          onSnapshot(collection(db, "profiles"), (snapshot) => {
            if (snapshot.empty) {
              defaultProfiles.forEach(p => setDoc(doc(db, "profiles", p.id), p));
            } else {
              profiles = snapshot.docs.map(d => d.data()).sort((a, b) => Number(a.id) - Number(b.id));
              renderAll();
            }
          });

          const q = query(collection(db, "logs"), orderBy("createdAt", "desc"));
          onSnapshot(q, (snapshot) => {
            logs = snapshot.docs.map(d => ({ docId: d.id, ...d.data() }));
            renderAll();
          });
        } catch (e) {
          initLocalStorage();
        }
      } else {
        initLocalStorage();
      }
    }

    function initLocalStorage() {
      document.getElementById('syncStatus').innerText = 'Local Mode';
      const savedProfiles = localStorage.getItem('wt_profiles');
      const savedLogs = localStorage.getItem('wt_logs');
      profiles = savedProfiles ? JSON.parse(savedProfiles) : defaultProfiles;
      logs = savedLogs ? JSON.parse(savedLogs) : [];
      if (!savedProfiles) localStorage.setItem('wt_profiles', JSON.stringify(profiles));
      renderAll();
    }

    function renderAll() {
      renderProfiles();
      renderHistory();
    }

    function renderProfiles() {
      const grid = document.getElementById('profilesGrid');
      grid.innerHTML = profiles.map(p => {
        const hexColor = colorMap[p.color] || '#C68B72';
        const userLogs = logs.filter(l => String(l.id) === String(p.id));
        const latestWeight = userLogs.length > 0 ? `${userLogs[0].weight} กก.` : 'ยังไม่บันทึก';

        return `
          <div class="profile-card" onclick="openWeightModal('${p.id}')">
            <div class="card-actions">
              <div class="color-tag" style="background-color: ${hexColor};"></div>
              <button class="edit-btn" onclick="openEditModal(event, '${p.id}')" title="แก้ไขโปรไฟล์">✎</button>
            </div>
            <div class="profile-name">${p.name}</div>
            <div class="profile-latest">${latestWeight}</div>
            <div class="profile-target">เป้าหมาย: ${p.targetWeight} ${p.targetWeight !== '-' ? 'กก.' : ''}</div>
          </div>
        `;
      }).join('');
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      if (logs.length === 0) {
        list.innerHTML = '<div class="empty-box">ยังไม่มีประวัติการบันทึก</div>';
        return;
      }

      list.innerHTML = logs.slice(0, 30).map((log, index) => {
        const member = profiles.find(p => String(p.id) === String(log.id));
        const name = member ? member.name : `ID: ${log.id}`;
        const hexColor = member ? (colorMap[member.color] || '#C68B72') : '#C68B72';
        const deleteKey = useFirebase ? log.docId : index;

        return `
          <div class="history-item">
            <div class="history-info">
              <div class="name">
                <span class="history-dot" style="background-color: ${hexColor};"></span>
                ${name}
              </div>
              <div class="time">${log.timestamp} ${log.note && log.note !== '-' ? '• ' + log.note : ''}</div>
            </div>
            <div class="history-right">
              <div class="history-weight">${log.weight} กก.</div>
              <button class="delete-log-btn" onclick="deleteLog('${deleteKey}')" title="ลบรายการ">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }

    window.openWeightModal = function(id) {
      const member = profiles.find(p => String(p.id) === String(id));
      if (!member) return;
      document.getElementById('selectedId').value = id;
      document.getElementById('modalMemberName').innerText = `บันทึกน้ำหนัก: ${member.name}`;
      document.getElementById('weightInput').value = '';
      document.getElementById('noteInput').value = '';
      toggleModal('weightModal', true);
      setTimeout(() => document.getElementById('weightInput').focus(), 100);
    };

    window.openEditModal = function(event, id) {
      event.stopPropagation();
      const member = profiles.find(p => String(p.id) === String(id));
      if (!member) return;
      document.getElementById('editMemberId').value = member.id;
      document.getElementById('editNameInput').value = member.name;
      document.getElementById('editTargetInput').value = member.targetWeight;
      document.getElementById('editColorInput').value = member.color;
      renderColorPicker(member.color);
      toggleModal('editModal', true);
    };

    function renderColorPicker(selectedColor) {
      const grid = document.getElementById('colorPickerGrid');
      grid.innerHTML = Object.entries(colorMap).map(([name, hex]) => `
        <div class="color-option ${name === selectedColor ? 'selected' : ''}" 
             style="background-color: ${hex};" 
             onclick="selectColor('${name}')"></div>
      `).join('');
    }

    window.selectColor = function(colorName) {
      document.getElementById('editColorInput').value = colorName;
      renderColorPicker(colorName);
    };

    window.toggleModal = function(modalId, show) {
      const modal = document.getElementById(modalId);
      if (show) modal.classList.add('active');
      else modal.classList.remove('active');
    };

    window.closeModal = function(event, modalId) {
      if (event.target.id === modalId) toggleModal(modalId, false);
    };

    window.handleWeightSubmit = async function(event) {
      event.preventDefault();
      const id = document.getElementById('selectedId').value;
      const weight = parseFloat(document.getElementById('weightInput').value).toFixed(1);
      const note = document.getElementById('noteInput').value.trim() || '-';

      const now = new Date();
      const timestamp = now.toLocaleDateString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric' }) + 
                        ' ' + now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

      const newEntry = {
        id: String(id),
        weight: weight,
        note: note,
        timestamp: timestamp,
        createdAt: Date.now()
      };

      toggleModal('weightModal', false);

      if (useFirebase && db) {
        await addDoc(collection(db, "logs"), newEntry);
      } else {
        logs.unshift(newEntry);
        localStorage.setItem('wt_logs', JSON.stringify(logs));
        renderAll();
      }
    };

    window.handleEditSubmit = async function(event) {
      event.preventDefault();
      const id = document.getElementById('editMemberId').value;
      const updated = {
        id: String(id),
        name: document.getElementById('editNameInput').value.trim(),
        targetWeight: document.getElementById('editTargetInput').value.trim() || '-',
        color: document.getElementById('editColorInput').value
      };

      toggleModal('editModal', false);

      if (useFirebase && db) {
        await setDoc(doc(db, "profiles", String(id)), updated);
      } else {
        const idx = profiles.findIndex(p => String(p.id) === String(id));
        if (idx !== -1) profiles[idx] = updated;
        localStorage.setItem('wt_profiles', JSON.stringify(profiles));
        renderAll();
      }
    };

    window.deleteLog = async function(key) {
      if (!confirm('ต้องการลบรายการนี้ใช่ไหม?')) return;
      if (useFirebase && db) {
        await deleteDoc(doc(db, "logs", key));
      } else {
        logs.splice(Number(key), 1);
        localStorage.setItem('wt_logs', JSON.stringify(logs));
        renderAll();
      }
    };

    initApp();
  </script>
</body>
</html>
